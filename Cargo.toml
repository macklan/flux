[workspace]
members = [
    "flux-server", "my-redis", 
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Macklan Badger <macklanwbadger@gmail.com>"]
license = "MIT"
repository = "https://github.com/macklan/flux"
homepage = "https://github.com/macklan/flux"
documentation = "https://docs.rs/flux"
description = "A high-performance, Socket.io-inspired real-time communication library"
keywords = ["websocket", "real-time", "socket", "async", "networking"]
categories = ["network-programming", "web-programming", "asynchronous"]
rust-version = "1.70"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Networking & HTTP
http = "0.2"
httparse = "1.8"

# Concurrency
dashmap = "5.5"
arc-swap = "1.6"

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.14"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"

# Development dependencies
criterion = "0.5"
tokio-test = "0.4"
proptest = "1.4"

# Additional dependencies for client and redis
url = "2.5"
backoff = "0.4"
testcontainers = "0.15"
